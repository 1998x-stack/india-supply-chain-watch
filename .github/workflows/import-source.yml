name: Import reviewed website source
on:
  push:
    paths:
      - 'bootstrap/part-05.txt'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore source and commit
        shell: bash
        run: |
          set -euo pipefail
          test -f bootstrap/part-01.txt
          test -f bootstrap/part-02.txt
          test -f bootstrap/part-03.txt
          test -f bootstrap/part-04.txt
          test -f bootstrap/part-05.txt
          cat bootstrap/part-{01..05}.txt | base64 --decode | tar -xJf -
          rm -rf bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: import India Supply Chain Watch V3 source'
          git push origin HEAD:main
