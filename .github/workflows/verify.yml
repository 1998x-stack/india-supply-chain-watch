name: Verify India Supply Chain Watch

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iscw-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      # This repository currently has no lockfile; use npm install rather than
      # falsely claiming a reproducible npm ci build. Add a reviewed lockfile
      # and switch to npm ci in a subsequent dependency-hardening pass.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Validate sourced records and security contracts
        run: npm test
      - name: Assert CSV exports match canonical JSON
        run: npm run exports:check
      - name: Validate TypeScript
        run: npm run typecheck
      - name: Build production Next.js application
        run: npm run build
      - name: Start site and smoke-test public routes
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- --port 3137 >/tmp/iscw-next.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          SMOKE_BASE_URL=http://127.0.0.1:3137 npm run smoke || {
            echo "Local server did not pass smoke tests; last startup messages:"
            tail -n 30 /tmp/iscw-next.log
            exit 1
          }
